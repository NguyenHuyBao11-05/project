<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Layout Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table id="layout" border="1" cellspacing="0" cellpadding="10" align="center" width="800">
        <!-- Header -->
        <tr>
            <td colspan="2" id="header">
                <h1>PROCESS LAYOUT EXAMPLE</h1>
            </td>
        </tr>

        <!-- Menu & Content -->
        <tr>
            <td id="menu" width="200">
                <b>Main Menu</b><br>
                Link one<br>
                Link two<br>
                Link three<br>
                Link four<br>
            </td>

            <td id="content">
                This is an example layout using the tables
            </td>
        </tr>

        <!-- Footer -->
         <!--this is a comment -->
        <tr>
            <td colspan="2" id="footer">
                www.Example of layout using tables.com
            </td>
        </tr>
    </table>
</body>
</html>
